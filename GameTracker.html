const pages=[['home','Inicio'],['add','Agregar sesión'],['games','Mis juegos'],['stats','Estadísticas'],['data','Datos']];let page='home';function nav(){ $('#nav').innerHTML=pages.map(p=>`<button data-p='${p[0]}' class='${page===p[0]?'active':''}'>${p[1]}</button>`).join('');document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{page=b.dataset.p;render()})}

function home(){let total=db.sessions.reduce((a,s)=>a+Number(s.hours),0),active=db.games.filter(g=>g.status==='Jugando'&&(g.playType||'Campaña')==='Campaña').sort((a,b)=>hrs(b.id)-hrs(a.id)),casual=db.games.filter(g=>g.status==='Jugando'&&g.playType==='Casual').sort((a,b)=>hrs(b.id)-hrs(a.id)),backlog=db.games.filter(g=>g.status==='Jugando'&&g.playType==='Backlog').sort((a,b)=>hrs(b.id)-hrs(a.id)),recent=[...db.sessions].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);$('#view').innerHTML=`<div class='grid'><div class='card metric'><span class='muted'>Horas totales</span><b>${total.toFixed(1)} h</b></div><div class='card metric'><span class='muted'>Juegos</span><b>${db.games.length}</b></div><div class='card metric'><span class='muted'>Terminados</span><b>${db.games.filter(g=>g.status==='Terminado').length}</b></div></div><div class='card'><h2>Campañas activas</h2><p class='muted section-note'>Ordenadas por horas totales, de mayor a menor.</p>${active.length?active.map(g=>`<div class='row'>${visual(g)}<div style='text-align:right'>${hrs(g.id).toFixed(1)} h <span class='status'>Campaña</span><div class='muted last-played'>Última vez: ${fmtDate(lastPlayed(g.id))}</div></div></div>`).join(''):`<p class='muted'>No hay campañas activas.</p>`}</div><div class='card'><h2>Jugados casualmente</h2>${casual.length?casual.map(g=>`<div class='row'>${visual(g)}<div style='text-align:right'>${hrs(g.id).toFixed(1)} h <span class='status casual'>Casual</span><div class='muted last-played'>Última vez: ${fmtDate(lastPlayed(g.id))}</div></div></div>`).join(''):`<p class='muted'>No hay juegos marcados como casuales.</p>`}</div><div class='card'><h2>Backlog</h2>${backlog.length?backlog.map(g=>`<div class='row'>${visual(g)}<div style='text-align:right'>${hrs(g.id).toFixed(1)} h <span class='status backlog'>Backlog</span><div class='muted last-played'>Última vez: ${fmtDate(lastPlayed(g.id))}</div></div></div>`).join(''):`<p class='muted'>No hay juegos en backlog.</p>`}</div><div class='card'><h2>Actividad reciente</h2>${recent.length?recent.map(s=>`<div class='row'>${(()=>{let g=db.games.find(x=>x.id===s.gameId);return g?visual(g):`<div><b>${esc(name(s.gameId))}</b></div>`})()}<div style='text-align:right'><b>${Number(s.hours).toFixed(1)} h</b><div class='muted'>${fmtDate(s.date)}</div></div></div>`).join(''):`<p class='muted'>Importá tu histórico o agregá una sesión.</p>`}</div>`}
function add(){let opts=db.games.map(g=>`<option value='${g.id}'>${esc(g.name)} — ${esc(g.platform)}</option>`).join('');$('#view').innerHTML=`<div class='card'><h2>Nueva sesión</h2><form id='sessionForm' class='form'><label>Juego<select id='game'><option value='__new'>＋ Crear nuevo juego</option>${opts}</select></label><label>Fecha<input id='date' type='date' value='${today()}' required></label><div id='newFields' class='full form'><label>Nombre<input id='newName' placeholder='Dungeon Siege'></label><label>Plataforma<input id='platform' placeholder='PC'></label><label>Estado<select id='status'><option>Jugando</option><option>Backlog</option><option>Pausado</option><option>Terminado</option><option>Abandonado</option></select></label></div><label>Duración (horas)<input id='hours' type='number' min='.01' step='.01' required placeholder='1.5'></label><label class='full'>Nota<textarea id='note' placeholder='Llegué al pantano...'></textarea></label><div class='full'><button class='btn primary'>Guardar sesión</button></div></form></div>`;let sel=$('#game'),nf=$('#newFields');function toggle(){nf.style.display=sel.value==='__new'?'grid':'none'}sel.onchange=toggle;toggle();$('#sessionForm').onsubmit=e=>{e.preventDefault();let id=sel.value;if(id==='__new'){let n=$('#newName').value.trim();if(!n)return alert('Ingresá el nombre del juego.');id=uid();db.games.push({id,name:n,platform:$('#platform').value.trim(),status:$('#status').value,playType:'Campaña'})}db.sessions.push({id:uid(),gameId:id,date:$('#date').value,hours:Number($('#hours').value),note:$('#note').value.trim()});save();page='home';render()}}
function games(){let q=(window.gamesQuery||''),ord=(window.gamesOrder||'az'),sf=(window.gamesStatus||'Todos'),vm=(window.gamesView||'list');let filtered=db.games.filter(g=>g.name.toLowerCase().includes(q.toLowerCase())&&(sf==='Todos'||g.status===sf));filtered.sort((a,b)=>ord==='az'?a.name.localeCompare(b.name):ord==='za'?b.name.localeCompare(a.name):ord==='hoursDesc'?hrs(b.id)-hrs(a.id):hrs(a.id)-hrs(b.id));$('#view').innerHTML=`<div class='card'><h2>Mis juegos</h2><div class='toolbar'><input id='gameSearch' placeholder='Buscar juegos…' value='${esc(q)}'><select id='gameStatus'><option value='Todos' ${sf==='Todos'?'selected':''}>Todos los estados</option><option value='Jugando' ${sf==='Jugando'?'selected':''}>Jugando</option><option value='Terminado' ${sf==='Terminado'?'selected':''}>Terminado</option></select><select id='gameOrder'><option value='az' ${ord==='az'?'selected':''}>A → Z</option><option value='za' ${ord==='za'?'selected':''}>Z → A</option><option value='hoursDesc' ${ord==='hoursDesc'?'selected':''}>Más horas → menos</option><option value='hoursAsc' ${ord==='hoursAsc'?'selected':''}>Menos horas → más</option></select></div><div class='games-head'><span class='games-count'>${filtered.length} juegos</span><div class='view-switch'><button id='viewList' class='${vm==='list'?'active':''}' title='Lista'>☷</button><button id='viewGrid' class='${vm==='grid'?'active':''}' title='Cuadrícula'>▦</button></div></div><div id='gameList' class='${vm}-mode'>${filtered.length?filtered.map(g=>`<div class='row'><div class='game-left'>${coverUrl(g)?`<img class='game-thumb' src='${coverUrl(g)}' alt='' referrerpolicy='no-referrer' onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><span class='game-badge' style='display:none'>${initials(g.name)}</span>`:`<span class='game-badge'>${initials(g.name)}</span>`}<div><b>${esc(g.name)}</b><div class='muted game-meta'>${esc(g.platform)} · ${db.sessions.filter(s=>s.gameId===g.id).length} sesiones</div><div class='muted last-played'>Última vez: ${fmtDate(lastPlayed(g.id))}</div></div></div><div class='game-right'><b class='game-hours'>${hrs(g.id).toFixed(1)} h</b> <span class='status ${g.status==='Terminado'?'done':''}'>${esc(g.status)}</span>${g.status==='Jugando'?`<select class='mini-select playType' data-id='${g.id}'><option value='Campaña' ${(g.playType||'Campaña')==='Campaña'?'selected':''}>Campaña</option><option value='Casual' ${g.playType==='Casual'?'selected':''}>Casual</option><option value='Backlog' ${g.playType==='Backlog'?'selected':''}>Backlog</option></select>`:''}</div></div>`).join(''):`<p class='muted'>No hay juegos que coincidan.</p>`}</div></div>`;$('#gameSearch').oninput=e=>{let pos=e.target.selectionStart;window.gamesQuery=e.target.value;games();let el=$('#gameSearch');el.focus();try{el.setSelectionRange(pos,pos)}catch(_){}};$('#gameStatus').onchange=e=>{window.gamesStatus=e.target.value;games()};$('#gameOrder').onchange=e=>{window.gamesOrder=e.target.value;games()};$('#viewList').onclick=()=>{window.gamesView='list';games()};$('#viewGrid').onclick=()=>{window.gamesView='grid';games()};document.querySelectorAll('.playType').forEach(s=>s.onchange=()=>{let g=db.games.find(x=>x.id===s.dataset.id);if(g){g.playType=s.value;save();games()}});bindCovers()}
function stats(){let total=db.sessions.reduce((a,s)=>a+Number(s.hours),0),months={};db.sessions.forEach(s=>months[s.date.slice(0,7)]=(months[s.date.slice(0,7)]||0)+Number(s.hours));let max=Math.max(1,...Object.values(months));let top=db.games.map(g=>({n:g.name,h:hrs(g.id)})).sort((a,b)=>b.h-a.h).slice(0,12);$('#view').innerHTML=`<div class='grid'><div class='card metric'><span class='muted'>Horas</span><b>${total.toFixed(1)}</b></div><div class='card metric'><span class='muted'>Días activos</span><b>${new Set(db.sessions.map(s=>s.date)).size}</b></div><div class='card metric'><span class='muted'>Terminados</span><b>${db.games.filter(g=>g.status==='Terminado').length}</b></div></div><div class='card'><h2>Horas por mes</h2>${Object.keys(months).sort().map(m=>`<div style='margin:13px 0'><div>${m} · <b>${months[m].toFixed(1)} h</b></div><div class='bar'><i style='width:${months[m]/max*100}%'></i></div></div>`).join('')||'<p class="muted">Sin datos.</p>'}</div><div class='card'><h2>Tiempo por juego</h2>${top.map(x=>`<div class='row'><span>${esc(x.n)}</span><b>${x.h.toFixed(1)} h</b></div>`).join('')||'<p class="muted">Sin datos.</p>'}</div>`}
function data(){ $('#view').innerHTML=`<div class='card'><h2>Datos y backup</h2><p>Los datos se guardan localmente en este navegador. <b>Importar CSV</b> y <b>Exportar CSV</b> usan el mismo formato para que puedas mantener un único archivo maestro.</p><p>Formato: <code>fecha,juego,plataforma,horas,estado,nota,categoria</code>. La columna <code>categoria</code> guarda Campaña, Casual o Backlog. La V6 conserva también juegos sin sesiones y sigue aceptando los CSV antiguos.</p><div class='actions'><button class='btn danger' id='wipe'>Eliminar todos los datos</button></div></div>`;$('#wipe').onclick=()=>{if(confirm('¿Eliminar todos los datos locales?')){db={games:[],sessions:[]};save();render()}}}
function csvCell(v){v=String(v??'');return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
$('#exportCsv').onclick=()=>{let rows=[['tipo','fecha','juego','plataforma','horas','estado','nota','categoria']];
[...db.sessions].sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>{let g=db.games.find(x=>x.id===s.gameId);if(!g)return;rows.push(['SESION',s.date,g.name,g.platform||'',String(Number(s.hours)),g.status||'Jugando',s.note||'',g.playType||'Campaña'])});
db.games.filter(g=>!db.sessions.some(s=>s.gameId===g.id)).sort((a,b)=>a.name.localeCompare(b.name)).forEach(g=>rows.push(['JUEGO','',g.name,g.platform||'','',g.status||'Backlog','',g.playType||'Backlog']));
let csv='\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='GameTracker-'+today()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function parseCSV(t){let rows=[];let row=[],field='',q=false;for(let i=0;i<t.length;i++){let c=t[i],n=t[i+1];if(c==='"'){if(q&&n==='"'){field+='"';i++}else q=!q}else if(c===','&&!q){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(field);if(row.some(x=>x.trim()))rows.push(row);row=[];field=''}else field+=c}row.push(field);if(row.some(x=>x.trim()))rows.push(row);return rows}
$('#importCsv').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{
let rows=parseCSV(await readTextFile(file));if(rows.length<2)throw new Error('CSV vacío');
let h=rows.shift().map(x=>x.replace(/^\uFEFF/,'').trim().toLowerCase());
let idx=(...xs)=>h.findIndex(v=>xs.includes(v));
let ti=idx('tipo','type','recordtype','record_type'),di=idx('fecha','date'),gi=idx('juego','game'),pi=idx('plataforma','platform'),hi=idx('horas','hours','duration'),si=idx('estado','status'),ni=idx('nota','note'),ci=idx('categoria','category','playtype','play_type');
if(gi<0)throw new Error('Falta la columna juego');
let parsedSessions=[],parsedGames=[];
for(let r of rows){
 let gn=(r[gi]||'').trim();if(!gn)continue;
 let plat=pi>=0?(r[pi]||'').trim():'',status=si>=0&&(r[si]||'').trim()||'Jugando',category=ci>=0&&(r[ci]||'').trim()||'Campaña';
 let typ=ti>=0?(r[ti]||'').trim().toUpperCase():'';
 let date=di>=0?(r[di]||'').trim():'',raw=hi>=0?(r[hi]||'').trim():'';
 if(typ==='JUEGO'){parsedGames.push({gn,plat,status,category});continue}
 let hv=Number(raw.replace(',','.'));
 if(date&&Number.isFinite(hv)&&hv>0)parsedSessions.push({gn,date,hv,plat,status,note:ni>=0?(r[ni]||'').trim():'',category});
}
if(!parsedSessions.length&&!parsedGames.length)throw new Error('No hay datos válidos');
let replace=confirm('Aceptar = REEMPLAZAR todos los datos con este CSV.\nCancelar = FUSIONAR y agregar solo datos nuevos.');
let temp=replace?{games:[],sessions:[]}:JSON.parse(JSON.stringify(db));
let getGame=x=>{let g=temp.games.find(g=>g.name.toLowerCase()===x.gn.toLowerCase()&&(g.platform||'').toLowerCase()===x.plat.toLowerCase());if(!g){g={id:uid(),name:x.gn,platform:x.plat,status:x.status,playType:x.category};temp.games.push(g)}else{if(x.status)g.status=x.status;if(x.category)g.playType=x.category}return g};
parsedGames.forEach(getGame);
let existing=new Map(),incoming=new Map(),added=0,skipped=0;
if(!replace)temp.sessions.forEach(s=>{let g=temp.games.find(x=>x.id===s.gameId);if(!g)return;let k=[s.date,(g.name||'').trim().toLowerCase(),(g.platform||'').trim().toLowerCase(),Number(s.hours).toFixed(8),(s.note||'').trim().toLowerCase()].join('|');existing.set(k,(existing.get(k)||0)+1)});
for(let x of parsedSessions){
 let g=getGame(x),k=[x.date,x.gn.toLowerCase(),x.plat.toLowerCase(),Number(x.hv).toFixed(8),x.note.toLowerCase()].join('|');
 if(!replace){let n=(incoming.get(k)||0)+1;incoming.set(k,n);if(n<=(existing.get(k)||0)){skipped++;continue}}
 temp.sessions.push({id:uid(),gameId:g.id,date:x.date,hours:x.hv,note:x.note});added++;
}
db=temp;save();render();
alert(replace?'CSV restaurado: '+temp.games.length+' juegos y '+added+' sesiones.':'Sincronización completada: '+added+' sesiones nuevas; '+skipped+' existentes omitidas.');
}catch(err){alert('No se modificó ningún dato. Error al importar CSV: '+(err&&err.message?err.message:'formato inválido'));}finally{e.target.value='';}};render();

</script><script>
if('serviceWorker' in navigator && location.protocol!=='file:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
